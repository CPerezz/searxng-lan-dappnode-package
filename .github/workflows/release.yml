name: Release

# Push tag v<version> after that version's publish transaction is mined. The release notes are read from the chain,
# so a GitHub release exists only for versions DAppNode can actually install; the job fails otherwise.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Read the published version from the chain
        id: chain
        env:
          RPC: https://ethereum-rpc.publicnode.com
        run: |
          name=$(jq -r .name dappnode_package.json); v=$(jq -r .version dappnode_package.json)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest version $v"; exit 1; }
          repo=$(cast resolve-name "$name" --rpc-url "$RPC")
          uri=$(cast call "$repo" "getBySemanticVersion(uint16[3])(uint16[3],address,bytes)" "[${v//./,}]" --rpc-url "$RPC" | tail -1)
          hash=$(cast --to-ascii "$uri")
          searxng=$(jq -r '.upstream[0].version' dappnode_package.json)
          cat > notes.md <<EOF
          \`$name\` **$v** is published on Ethereum mainnet. SearXNG \`$searxng\`.

          - Install: open \`http://dappnode.local/installer/public/$name\` on your home network, or enter the name in the DAppStore.
          - Release: \`$hash\` (signed by \`0x3211695ED0b0c277E7340dA9A6ED025463774797\`; see the README to trust that key)
          - Repo contract: https://etherscan.io/address/$repo
          EOF

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
