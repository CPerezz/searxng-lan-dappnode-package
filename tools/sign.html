<!doctype html>
<!-- Signs a DAppNode release message with the browser wallet (personal_sign), for tools/sign-release.mjs assemble.
     Serve this file next to message.txt (the output of `sign-release.mjs message`, without the trailing newline):
       python3 -m http.server 8765    then open    http://localhost:8765/sign.html?address=<publisher address>   -->
<html lang="en">
<meta charset="utf-8">
<title>Sign DAppNode release</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 2em auto; padding: 0 1em; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f3f4f6; padding: 1em; border-radius: 6px; }
  button { font-size: 16px; padding: .5em 1.2em; }
</style>
<h1>Sign the release</h1>
<p>Expected signer: <code id="addr"></code></p>
<p>Message (one <code>file cid</code> line per release file):</p>
<pre id="msg">loading…</pre>
<button id="sign">Sign with my wallet</button>
<h2>Signature</h2>
<pre id="sig">—</pre>
<script>
  const expected = new URLSearchParams(location.search).get("address") || "";
  document.getElementById("addr").textContent = expected || "(any)";
  let message = null;
  fetch("message.txt").then((r) => r.text()).then((t) => {
    message = t.replace(/\n$/, "");
    document.getElementById("msg").textContent = message;
  });
  document.getElementById("sign").onclick = async () => {
    if (!window.ethereum) return alert("No browser wallet found. Open this page in the browser where your wallet is installed.");
    if (message === null) return alert("Message not loaded yet.");
    const [account] = await window.ethereum.request({ method: "eth_requestAccounts" });
    if (expected && account.toLowerCase() !== expected.toLowerCase()) return alert(`The wallet's account is ${account}, not ${expected}.`);
    const hex = "0x" + Array.from(new TextEncoder().encode(message), (b) => b.toString(16).padStart(2, "0")).join("");
    const signature = await window.ethereum.request({ method: "personal_sign", params: [hex, account] });
    document.getElementById("sig").textContent = signature;
  };
</script>
</html>
